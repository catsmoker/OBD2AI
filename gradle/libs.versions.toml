[versions]
androidGradlePlugin = "9.4.0"
kotlin = "2.4.20"
coreKtx = "1.19.0"
appcompat = "1.8.0"
constraintlayout = "2.2.2"
material = "1.14.0"
navigation = "2.10.1"
lifecycle = "2.11.0"
obdApi = "1.4.1"
junit = "4.13.2"
orgJson = "20260814"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
speedview = "1.6.1"
swiperefreshlayout = "1.2.0"
google-services = "4.5.0"
play-services-ads = "25.4.0"
firebase-analytics = "22.5.0"
core-splashscreen = "1.2.0"

[libraries]
# AndroidX Core & UI (for Views, not Compose)
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "core-splashscreen" }

# AndroidX Lifecycle
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }

# AndroidX Navigation
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }

# 3rd Party Libraries
kotlin-obd-api = { group = "com.github.eltonvs", name = "kotlin-obd-api", version.ref = "obdApi" }
speedviewlib = { group = "com.github.anastr", name = "speedviewlib", version.ref = "speedview" }
play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "play-services-ads" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics-ktx", version.ref = "firebase-analytics" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
navigation-safeargs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }
google-gms-google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }